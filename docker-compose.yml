version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: threed_generator
    ports:
      - "5432:5432"
    volumes:
      - ./database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres_data:/var/lib/postgresql/data

  llama-server:
    image: ghcr.io/ggerganov/llama.cpp:server
    command: -m /models/gemma-2-8b-it.Q4_K_M.gguf --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
      
  worker:
    build: 
      context: ./functions
    environment:
      - DB_HOST=db
      - LLM_URL=http://llama-server:8080/v1
      - FUSION_URL=http://host.docker.internal:5000
      - EXPORT_DIR_HOST=/Users/robwells/sc/3d-model-generator/temp
    volumes:
      - ./temp:/temp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

volumes:
  postgres_data:
